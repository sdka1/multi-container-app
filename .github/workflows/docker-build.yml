name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  docker-build-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Frontend Image
        run: docker build -t sdk2022/frontend-app ./frontend

      - name: Build Backend Image
        run: docker build -t sdk2022/backend-app ./backend

      - name: Push Frontend Image
        run: docker push sdk2022/frontend-app

      - name: Push Backend Image
        run: docker push sdk2022/backend-app

# Retrying pipeline after Docker token update